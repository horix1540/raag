[project]
name = "cornerstone-rag"
version = "0.1.0"
description = "Confidence-aware RAG pipeline with hallucination detection"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Lets tests do `from src...` without an editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: needs a model download or a running LLM; deselect with -m 'not slow'",
    "gpu: needs CUDA",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # dataclass field defaults are intentional here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
